{%- assign lesson_number = include.lesson | plus: 0 -%}
<nav class="tbd-learn-progress" aria-label="Learn journey progress">
  <div class="tbd-learn-progress__summary">
    <span><strong>{{ include.stage }}</strong> · Lesson {{ lesson_number }} of 14</span>
    <span class="tbd-learn-progress__status tbd-learn-progress__status--{{ include.status | default: 'planned' }}">{{ include.status_label | default: 'Planned' }}</span>
  </div>
  <ol class="tbd-learn-progress__bar" aria-hidden="true">
    {%- for item in (1..14) -%}
      <li class="{% if item == lesson_number %}is-current{% elsif item < lesson_number %}is-past{% endif %}{% if item > 4 %} is-planned{% endif %}"></li>
    {%- endfor -%}
  </ol>
</nav>
